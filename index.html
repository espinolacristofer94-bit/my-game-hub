<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #ff4757; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 40px auto;
        }
        .card {
            background-color: #2f3542;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: 0.2s;
        }
        .card:hover {
            background-color: #ff4757;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Welcome to the Arcade</h1>
    <p>A simple collection of open-source browser games.</p>

    <div class="grid">
        <a href="https://play2048.co/" target="_blank" class="card">
            Play 2048
        </a>
        
        <a href="https://haxed.net/" target="_blank" class="card">
            Classic Retro Games
        </a>
    </div>

</body>
</html>
